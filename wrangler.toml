name = "rna-game"
main = "src/worker.js"
compatibility_date = "2026-11-01"
# rna.game points at this Worker; the first deploy creates the DNS record and certificate
routes = [{ pattern = "rna.game", custom_domain = true }]

# tests run before every deploy (and when wrangler dev starts); if they fail, nothing is deployed
[build]
command = "npm test"

# gives the Worker its own version id, so open pages can tell when a newer version is live
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# anonymous health reports (src/reports.js); read them at /reports?key=<REPORT_KEY secret>
[[durable_objects.bindings]]
name = "REPORTS"
class_name = "ReportLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReportLog"]

[observability]
enabled = false

# Previews: Cloudflare builds every non-main branch (the improvement loop's pull requests, for example) with
# `wrangler preview`, which needs its own bindings. Each Preview gets its own, empty Durable Object namespaces, so a
# Preview never touches the live game's rooms or reports.
[previews.version_metadata]
binding = "CF_VERSION_METADATA"

[[previews.durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[previews.durable_objects.bindings]]
name = "REPORTS"
class_name = "ReportLog"
