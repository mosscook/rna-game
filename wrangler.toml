name = "rna-game"
main = "src/worker.js"
compatibility_date = "2026-11-01"
# rna.game points at this Worker; the first deploy creates the DNS record and certificate
routes = [{ pattern = "rna.game", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = false
