<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RNA Strand Soup v2</title>
<style>
:root{
  /* Layout: the soup fills the whole screen; everything else floats over it, small and out of the way.
     Same slide-and-stain palette as RNA Fold Lab: brightfield in light, darkfield in dark. */
  --field:#ECEEF4; --surface:#F9FAFC; --ink:#1D2136; --muted:#596079; --line:#D2D6E2;
  --stain:#5A3EC8; --stain-soft:#E6E0FB; --warn:#B4501A;
  --base-a:#17805A; --base-u:#C23548; --base-g:#946200; --base-c:#1C68BD;
  --pond:#FCFCFE; --vent:#E0703C; --sun:#D9B21C; --flow:#7FA7D9;
  --ice:#D6ECF7; --ice-edge:#4F90B8; --mg:#7FA36C;
  --p1:#5B6B8C; --p2:#9A4577; --p3:#2C7F88; --p4:#7B5B45; --p5:#A8641F; --p6:#5B8A2A; --p7:#B8483A; --p8:#7D7740; --p9:#8E4E9E;
  --h1:#0F8F8F; --h2:#C2410C; --h3:#2563EB; --h4:#B4237A; --h5:#4D7C0F; --h6:#9333EA; --h7:#B45309; --h8:#0E7490; --h9:#BE123C; --h10:#15803D; --h11:#7C3AED; --h12:#A16207;
  /* the device's own fonts: nothing loads from other sites */
  --font-display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --field:#0D101C; --surface:#161A2C; --ink:#E7E9F3; --muted:#9BA2BD; --line:#2B3152;
    --stain:#AC97FF; --stain-soft:#2A2550; --warn:#F09A62;
    --base-a:#4FD39A; --base-u:#FF7F8E; --base-g:#F2C14E; --base-c:#74B6FF;
    --pond:#080A14; --vent:#E0703C; --sun:#E3C54A; --flow:#3E5F8F;
    --ice:#173247; --ice-edge:#86CBEC; --mg:#6F9A5C;
    --p1:#9FB0D4; --p2:#E58DBB; --p3:#6CCAD3; --p4:#C9A98C; --p5:#E7A35E; --p6:#A9D36E; --p7:#F08A7C; --p8:#C9C38A; --p9:#D39BDE;
    --h1:#5EEAD4; --h2:#FB923C; --h3:#60A5FA; --h4:#F472B6; --h5:#A3E635; --h6:#C084FC; --h7:#FBBF24; --h8:#22D3EE; --h9:#FB7185; --h10:#4ADE80; --h11:#A78BFA; --h12:#FDE047;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --field:#0D101C; --surface:#161A2C; --ink:#E7E9F3; --muted:#9BA2BD; --line:#2B3152;
  --stain:#AC97FF; --stain-soft:#2A2550; --warn:#F09A62;
  --base-a:#4FD39A; --base-u:#FF7F8E; --base-g:#F2C14E; --base-c:#74B6FF;
  --pond:#080A14; --vent:#E0703C; --sun:#E3C54A; --flow:#3E5F8F;
  --ice:#173247; --ice-edge:#86CBEC; --mg:#6F9A5C;
  --p1:#9FB0D4; --p2:#E58DBB; --p3:#6CCAD3; --p4:#C9A98C; --p5:#E7A35E; --p6:#A9D36E; --p7:#F08A7C; --p8:#C9C38A; --p9:#D39BDE;
    --h1:#5EEAD4; --h2:#FB923C; --h3:#60A5FA; --h4:#F472B6; --h5:#A3E635; --h6:#C084FC; --h7:#FBBF24; --h8:#22D3EE; --h9:#FB7185; --h10:#4ADE80; --h11:#A78BFA; --h12:#FDE047;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--ink);font:16px/1.4 var(--font-body)}
h1{font:800 26px/1 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 15px/1.2 var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stain);outline-offset:2px}
/* floating surfaces: semi-opaque, no blur (blur over a moving canvas is costly on Chromebooks) */
.pond{position:fixed;inset:0;overflow:hidden;background:var(--pond);
  --glass:color-mix(in srgb,var(--surface) 86%,transparent);--edge:color-mix(in srgb,var(--line) 80%,transparent)}
/* hybrid: environment canvas, strand SVG on top of it, then a canvas for names, effects and the minimap */
#cv,#sv,#top{position:absolute;inset:0;width:100%;height:100%;display:block}
#sv{pointer-events:none;overflow:hidden}
#top{touch-action:none;cursor:crosshair}
/* phones and tablets: no text selection, long-press menus, tap flashes or double-tap zoom while playing (typing fields
   and the dev panel's text stay selectable) */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,[contenteditable],.dev pre{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.hud,.trk,.fab,.panel,.acts .btn{background:var(--glass);border:1px solid var(--edge);box-shadow:0 2px 10px rgb(0 0 0 / .18)}

/* top left: time, your complexity, your place, where you are */
.hud{position:absolute;left:10px;top:10px;display:flex;gap:12px;align-items:center;padding:5px 12px;border-radius:99px;font-size:13px;color:var(--muted);pointer-events:none;max-width:calc(100% - 220px)}
.hud b{color:var(--ink);font-variant-numeric:tabular-nums}
.hud #time{font:800 18px/1 var(--font-display)}
.hud .sc{display:flex;gap:4px;align-items:baseline}
.hud .sc b{font:800 16px/1 var(--font-display)}
.hud small{font-size:11px}
#rank{font-weight:700;color:var(--ink)}
#zone{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zone:empty,#rank:empty{display:none}

/* top right: the recipe you are following, compact; tap it to open the full list */
.trk{position:absolute;right:10px;top:10px;display:grid;justify-items:center;gap:7px;padding:8px 11px;border-radius:10px;cursor:pointer;text-align:center;max-width:calc(100% - 20px)}
.trk .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:13px;font-weight:700}
/* the next letter to collect, as a coloured badge */
.trk .nx{--c:var(--muted);display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--font-body);color:var(--muted)}
.trk .nx b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--pond);font:800 12px/1 var(--font-mono)}
.trk .hd .meta{font-weight:400}
.trk.ready{border-color:var(--stain);box-shadow:0 0 0 2px var(--stain),0 2px 10px rgb(0 0 0 / .18)}
.trk.ready .go{color:var(--stain)}
.trk .row{display:flex;gap:6px;align-items:center;justify-content:center}
.fab{position:absolute;right:10px;top:10px;height:34px;padding:0 12px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:700}
.fab:hover,.trk:hover{border-color:var(--ink)}

/* the full list slides over the right edge */
.panel{position:absolute;right:10px;top:10px;bottom:62px;width:min(330px,calc(100% - 20px));border-radius:12px;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px}
.ph h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.x{width:28px;height:28px;border:0;border-radius:6px;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--ink);background:var(--stain-soft)}

/* bottom left: actions */
.acts{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.btn.sm{width:36px;padding:0}
.btn:hover{border-color:var(--ink)}
.btn.go,.acts .btn.go{background:var(--stain);border-color:var(--stain);color:var(--surface)}
.btn.go.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--stain) 35%,transparent)}}
.btn[aria-pressed="true"]{background:var(--stain-soft);border-color:var(--stain)}
kbd{font:700 10px/1 var(--font-mono);border:1px solid currentColor;border-radius:4px;padding:2px 4px;margin-left:6px;opacity:.7}

.toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);max-width:min(88%,520px);padding:7px 12px;border-radius:8px;
  background:var(--ink);color:var(--surface);font-size:13.5px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:.92}
.newver{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:6;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:700 13px/1.2 var(--font-body);cursor:pointer;box-shadow:0 4px 18px rgb(0 0 0/.35)}
.newver:hover{border-color:var(--ink)}
/* a room's lobby: who is here, and Start for the host */
.lobbybar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;border-radius:99px;z-index:4;
  background:var(--glass);border:1px solid var(--edge);box-shadow:0 2px 10px rgb(0 0 0 / .18);font-size:13px;color:var(--muted);max-width:calc(100% - 20px)}
.lobbybar b{color:var(--ink)}
.lobbybar .btn{height:32px}
.lobbybar.wait{padding-right:14px}
.lobbybar .auto{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;white-space:nowrap}
.lobbybar .auto input{accent-color:var(--stain);margin:0}
@media (max-width:760px){ .lobbybar{top:52px} }
/* spectating: a bar at the bottom middle with whose view this is */
.watch{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:99px;max-width:calc(100% - 20px);
  background:var(--glass);border:1px solid var(--edge);box-shadow:0 2px 10px rgb(0 0 0 / .18);z-index:4}
.watch .who{display:grid;padding:0 8px;min-width:0;text-align:center;line-height:1.2}
.watch .who b{font:700 14px/1.2 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .who small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .btn{height:32px}
.sheet .alt{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;justify-self:center}
.sheet .alt:hover{color:var(--ink)}

/* start and end screens */
/* the start screen's logo: RNA written by three live strands, GAME in plain type beneath */
.logo{display:grid;justify-items:center;pointer-events:none;user-select:none}
.logo svg{width:min(300px,78vw,42vh);height:auto;overflow:visible}
.logoWord{font:800 clamp(22px,min(6vw,5vh),36px)/1 var(--font-display);letter-spacing:.42em;margin:-6px 0 6px .42em;color:var(--ink);opacity:.92}
.sheet.start{gap:8px;padding:14px 16px;max-width:400px}
.sheet.start h2{font-size:17px}
.sheet.start > p{font-size:13.5px;margin:0}
.sheet.start .mode{padding:8px 12px}
.sheet.start .mode b{font-size:16px}
.sheet.start .mode small{font-size:12px}
.sheet.start .room{margin:6px 0 2px}
.sheet.start .fine{margin:0;font-size:11.5px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;align-content:safe center;gap:4px;padding:16px;background:color-mix(in srgb,var(--pond) 55%,transparent);overflow:auto;z-index:5}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:440px;display:grid;gap:10px;box-shadow:0 8px 30px rgb(0 0 0 / .25)}
.sheet h2{font-size:20px}
.sheet .fine{font-size:12px;color:var(--muted)}
.sheet ol.steps{display:grid;gap:6px;font-size:14.5px;counter-reset:s}
.sheet ol.steps li{counter-increment:s;padding-left:26px;position:relative}
.sheet ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--stain-soft);
  color:var(--ink);font:700 12px/19px var(--font-mono);text-align:center}
.codon{display:flex;gap:8px;justify-content:center;align-items:center;padding:6px 0}
.cd{--c:var(--muted);width:54px;height:62px;border-radius:10px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font:800 28px/1 var(--font-mono);cursor:pointer}
.cd:hover{filter:brightness(1.15)}
.cd.dice{width:44px;height:44px;font-size:20px;border-style:dashed;margin-left:6px}
.room{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.room label{font-weight:700}
.room .host{font-family:var(--font-mono);color:var(--muted)}
.room input{font:700 16px/1 var(--font-mono);height:36px;width:13ch;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.rank{display:grid;gap:4px;font-size:15px}
.rank li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.rank li.me{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}

.meta{font:400 11.5px/1.3 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bA{--c:var(--base-a)} .bU{--c:var(--base-u)} .bG{--c:var(--base-g)} .bC{--c:var(--base-c)}
.chip{--c:var(--muted);width:19px;height:22px;border-radius:4px;border:1.5px dashed var(--c);color:var(--c);font:700 12px/19px var(--font-mono);text-align:center;opacity:.75}

.board{display:grid;gap:3px;font-size:13px}
.board li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.board li.me{font-weight:700}
.board .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.rank small.style{display:block;font:400 11px var(--font-body);color:var(--muted)}
.mine{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.brk{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.brk h3{margin:0;font:700 12px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seg{padding:2px 7px;border:1.5px solid var(--stain);border-radius:99px;font-weight:600;white-space:nowrap}
.seg.core{background:var(--stain);color:var(--surface)}
.seg.dmg{border-style:dashed;color:var(--muted);text-decoration:line-through}
.seg .st{font:400 10.5px var(--font-mono);margin-left:4px;opacity:.85}
.recipes{display:grid;gap:4px}
.rec{width:100%;display:grid;gap:3px;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.rec:hover{border-color:var(--ink)}
.rec[aria-pressed="true"]{border-color:var(--stain);background:color-mix(in srgb,var(--stain-soft) 60%,var(--surface))}
.rec.ready{border-color:var(--stain);box-shadow:inset 3px 0 0 var(--stain)}
.rec .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rec .nm{font-weight:700;font-size:13.5px}
.rec .does{font-size:11.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slots{display:flex;gap:2px}
/* recipe slots: collected letters are solid in their colour, letters still to come are outlined in it,
   the next one is larger and pulses; slots for any letter (the stem's first two) are dashed */
.sl{--c:var(--muted);width:19px;height:22px;border-radius:4px;border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);font:700 12px/19px var(--font-mono);text-align:center;color:var(--c)}
.sl.gap{margin-left:4px}
.sl.done{border-color:var(--c);background:var(--c);color:var(--pond)}
.sl.next{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 0 2px var(--ink);transform:scale(1.14);animation:nx 1.1s ease-in-out infinite}
@keyframes nx{50%{box-shadow:0 0 0 2px var(--ink),0 0 10px 3px color-mix(in srgb,var(--c) 70%,transparent)}}
.sl.any{border-style:dashed;font-weight:400;font-size:11px}
/* a wrong letter: still collected, crossed by a red mark */
.sl.done.miss{background:color-mix(in srgb,var(--c) 45%,var(--surface));color:var(--ink);outline:2px solid var(--warn);outline-offset:1px}
.trk .off{font:700 11px/1 var(--font-body);color:var(--warn)}
.seg.weak{border-style:dotted}
.seg.lucky{border-color:var(--sun);box-shadow:0 0 6px color-mix(in srgb,var(--sun) 60%,transparent)}
.sl.any.next{--c:var(--ink)}
/* letter colours, after the slot and chip defaults so they win */
.sl.bA,.chip.bA,.nx.bA{--c:var(--base-a)} .sl.bU,.chip.bU,.nx.bU{--c:var(--base-u)} .sl.bG,.chip.bG,.nx.bG{--c:var(--base-g)} .sl.bC,.chip.bC,.nx.bC{--c:var(--base-c)}
/* ?dev: numbers and test buttons for building and balancing the game */
.dev{position:absolute;left:10px;top:52px;width:300px;max-height:calc(100% - 120px);overflow-y:auto;padding:8px 10px;border-radius:10px;display:grid;gap:6px;z-index:3;
  background:var(--glass);border:1px solid var(--edge);font:400 11px/1.45 var(--font-mono);color:var(--muted)}
.dev pre{margin:0;font:inherit;white-space:pre-wrap}
.dev pre b{color:var(--ink);font-weight:700}
.dev .row{display:flex;flex-wrap:wrap;gap:4px}
.dev .btn{height:24px;padding:0 8px;font:700 11px var(--font-body)}
.dev .legend{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px}
.dev .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.dev{width:320px}
.dev details.sec{border-top:1px solid var(--line);padding-top:6px}
.dev details.sec > summary{cursor:pointer;font:800 11px var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink);list-style-position:inside}
.dev details.sec .body{display:grid;gap:6px;margin-top:6px}
.dev .lk{display:grid;grid-template-columns:84px minmax(90px,1fr) 34px;align-items:center;gap:6px;font-size:11px;width:100%;box-sizing:border-box}
.dev .lk input{width:100%;margin:0}
.dev .lk output{font:11px var(--font-mono);text-align:right;color:var(--ink)}
.dev .tk{grid-template-columns:minmax(80px,1fr) 52px 18px;row-gap:1px;margin-top:3px}
.dev .tk span{grid-column:1/-1;line-height:1.25;font-family:var(--font-body)}
.dev .tk.changed span{color:var(--ink);font-weight:700}
.dev .tk button{all:unset;cursor:pointer;color:var(--muted);text-align:center;font-size:12px}
.dev .tk button:hover{color:var(--ink)}
.dev .tk:not(.changed) button{visibility:hidden}
.dev .tuneHead{font:700 10.5px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.dev .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px}
.dev .cols label{display:flex;align-items:center;gap:6px}
.dev .cols input{width:30px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.dev .note{font-size:11px;color:var(--muted)}
.dev h3{margin:2px 0 0;font:700 10px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* the microscope look (lens.js): layers between the strands and the top canvas */
.lens,.edgeblur{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lens.soft{background:radial-gradient(ellipse farthest-corner at 50% 50%,transparent 52%,rgb(0 0 0/.28) 78%,rgb(0 0 0/.62) 100%)}
.lens.eyepiece{background:radial-gradient(circle farthest-side at 50% 50%,transparent 72%,rgb(0 0 0/.45) 90%,rgb(0 0 0/.9) 99%,#000 100%)}
.lens.rim::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse farthest-corner at 50% 50%,transparent 66%,rgb(90 200 255/.07) 74%,rgb(255 90 210/.07) 82%,transparent 90%)}
.lens.eyepiece.rim::after{background:radial-gradient(circle farthest-side at 50% 50%,transparent 80%,rgb(90 200 255/.09) 86%,rgb(255 90 210/.09) 92%,transparent 97%)}
.lens .grain{position:absolute;inset:-160px;opacity:.07;will-change:transform;animation:grain .6s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-61px,37px)}40%{transform:translate(43px,-89px)}60%{transform:translate(-97px,-23px)}80%{transform:translate(71px,101px)}100%{transform:translate(0,0)}}
.edgeblur{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  -webkit-mask-image:radial-gradient(ellipse farthest-corner at 50% 50%,transparent 60%,#000 92%);mask-image:radial-gradient(ellipse farthest-corner at 50% 50%,transparent 60%,#000 92%)}
.edgeblur.round{-webkit-mask-image:radial-gradient(circle farthest-side at 50% 50%,transparent 62%,#000 86%);mask-image:radial-gradient(circle farthest-side at 50% 50%,transparent 62%,#000 86%)}
@media (prefers-reduced-motion:reduce){ .lens .grain{animation:none} }
/* the start screen: three ways in */
.modes{display:grid;gap:8px}
.mode{display:grid;gap:2px;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;font:inherit;position:relative}
.mode b{font:800 17px/1.2 var(--font-display)}
.mode small{font-size:12.5px;color:var(--muted)}
.mode:hover{border-color:var(--ink)}
.mode.go{background:var(--stain);border-color:var(--stain);color:var(--surface)}
.mode.go small{color:color-mix(in srgb,var(--surface) 82%,transparent)}
.mode .tag{display:inline-block;margin-left:8px;vertical-align:2px;font:700 11px/1 var(--font-body);padding:4px 8px;border-radius:99px;background:var(--stain-soft);color:var(--ink)}
.sheet details{font-size:13.5px}
.sheet details summary{cursor:pointer;color:var(--muted);font-size:13px}
.sheet details ol.steps{margin-top:8px}
/* Learn: the coach card at the top middle, one step at a time */
.coach{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;
  padding:10px 12px;border-radius:12px;z-index:4;background:var(--glass);border:1px solid var(--edge);box-shadow:0 2px 10px rgb(0 0 0 / .18);font-size:13.5px}
.coach .n{font:700 11px/1 var(--font-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.coach b{font:800 15px/1.2 var(--font-display)}
.coach p{margin:2px 0 0}
.coach .note{font-size:12px;color:var(--muted)}
.coach .tip{font-size:12.5px;color:var(--warn);font-weight:700}
.coach .alt{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.coach.pop{animation:pop .45s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--stain) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.hint{animation:pulse 1.2s ease-in-out infinite;border-color:var(--stain)!important}
@media (max-width:760px){ .coach{top:52px} }
@media (max-width:760px){ .watch{bottom:56px} }
@media (max-width:640px){
  .hud{gap:8px;padding:4px 10px;max-width:calc(100% - 130px)}
  #zone{display:none}
  kbd{display:none}
  .sl,.chip{width:16px;height:20px;font-size:11px;line-height:18px}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} .btn.go.pulse{animation:none} .sl.next{animation:none} .hint,.coach.pop{animation:none} }
</style>

<body>
<div class="pond" id="pond">
  <canvas id="cv" aria-hidden="true"></canvas>
  <svg id="sv" aria-hidden="true"></svg>
  <canvas id="top" aria-label="The soup. Your strand swims toward the pointer and collects the letters its head touches."></canvas>

  <div class="hud" aria-live="off"><b id="time">5:00</b><span class="sc"><b id="score">0</b><small>complexity</small></span><span id="rank"></span><span id="zone"></span></div>

  <button class="trk" id="trk" type="button" aria-controls="panel" aria-expanded="false" hidden></button>
  <button class="fab" id="bRec" type="button" aria-controls="panel" aria-expanded="false">Recipes<kbd>R</kbd></button>

  <aside class="panel" id="panel" aria-label="Recipes, your strand and scores" hidden>
    <div class="ph"><h2>Recipes</h2><button class="x" id="bClose" type="button" aria-label="Close">&times;</button></div>
    <ul class="recipes" id="recipes"></ul>
    <div class="ph"><h2>Your strand</h2><span class="meta" id="mineN"></span></div>
    <div class="mine" id="mine"></div>
    <div class="ph"><h2>Scores</h2></div>
    <ol class="board" id="board"></ol>
  </aside>

  <div class="acts" role="toolbar" aria-label="Actions">
    <button class="btn" type="button" id="bFold">Fold<kbd>Space</kbd></button>
    <button class="btn" type="button" id="bDrop">Drop<kbd>X</kbd></button>
    <button class="btn" type="button" id="bWatch" aria-pressed="false" title="Watch other strands (V)">Watch<kbd>V</kbd></button>
    <button class="btn sm" type="button" id="bLow" aria-pressed="false" aria-label="Low detail" title="Low detail">Lo</button>
    <button class="btn sm" type="button" id="bLook" aria-pressed="false" aria-label="Outline map" title="Outline map: black ground with coloured edges, so strands stand out (O)" hidden>&#9711;</button>
    <button class="btn sm" type="button" id="bPause" aria-pressed="false" aria-label="Pause" title="Pause (P)">&#10073;&#10073;</button>
  </div>

  <div class="lobbybar" id="lobbyBar" role="status" hidden><span id="lobbyText"></span><label class="auto" id="autoWrap" title="After each round, the lobby counts down 10 seconds and starts the next one"><input type="checkbox" id="autoBox"> Auto-start next rounds</label><label class="auto" id="mapWrap" title="Play the old painted map instead of the generated world, as a fallback (for example if a Chromebook runs slowly)"><input type="checkbox" id="mapBox"> Classic map</label><button class="btn go" type="button" id="bStart">Start game</button></div>
  <div class="coach" id="coach" role="status" aria-live="polite" hidden><span class="n" id="coachN"></span><div><b id="coachT"></b><p id="coachX"></p><p class="note" id="coachNote"></p><p class="tip" id="coachTip" hidden></p></div><button class="alt" type="button" id="coachSkip">Skip</button></div>
  <aside class="dev" id="dev" aria-label="Developer tools" hidden></aside>
  <div class="watch" id="watchBar" role="group" aria-label="Spectating" hidden>
    <button class="btn sm" type="button" id="wPrev" aria-label="Previous strand" title="Previous (←)">&#9664;</button>
    <span class="who" aria-live="polite"><b id="wName"></b><small id="wNote"></small></span>
    <button class="btn sm" type="button" id="wNext" aria-label="Next strand" title="Next (→)">&#9654;</button>
    <button class="btn" type="button" id="wTour" aria-pressed="false" title="Move to the next strand every 15 seconds">Tour</button>
    <button class="btn sm" type="button" id="wStop" aria-label="Stop watching" title="Back to your strand (V)">&times;</button>
  </div>
  <p class="toast" id="toast" aria-live="polite"></p>
  <div class="overlay" id="overlay"><div class="logo" id="logo" hidden aria-label="RNA game"><svg id="logoSvg" viewBox="-24 -26 348 176" aria-hidden="true"></svg><div class="logoWord" aria-hidden="true">GAME</div></div><div class="sheet" id="sheet"></div></div>
</div>

<script src="segments.js"></script>
<script src="rna-strand.js"></script>
<script src="biomes.js"></script>
<script src="worldgen.js"></script>
<script src="map.js"></script>
<script src="bots.js"></script>
<script src="sim.js"></script>
<script src="net.js"></script>
<script src="lens.js"></script>
<script>
(() => {
'use strict';
const RS = window.RNAStrand, $ = id => document.getElementById(id);
const BASES = RS.BASES;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => ((a + Math.PI * 3) % TAU) - Math.PI;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- recipes: two stem letters, the core, then the stem's partners in reverse ----------
   Each segment type's card (what it does, how real it is, the science) comes from segments.js */
const SEG = window.SoupSegments, FNS = SEG.LIST;
const RECIPES = RS.RECIPES;
const recipeLen = fn => RECIPES[fn].length + 4;

/* ---------- the game runs in sim.js; this file draws it and handles the page ---------- */
const MAP = window.SoupMap, MK = MAP.K, BOTS = window.SoupBots;
let W = MAP.W, H = MAP.H;   /* a generated world can be smaller: refreshed every frame */
/* the generated world (worldgen.js) is the map; ?map=classic falls back to the old painted one, in solo play and for a
   room's host (who can also tick Classic map in the lobby) */
const WANT_CLASSIC = new URLSearchParams(location.search).get('map') === 'classic', WANT_WORLD = !WANT_CLASSIC;
const zoneAt = (x, y) => MAP.zoneAt(x, y);
/* the name of each place, shown at the top left (biomes.js) */
const ZONE_TEXT = Object.fromEntries(Object.entries(window.SoupBiomes.ZONES).map(([k, z]) => [k, z.label]));
const stage = RS.createStage($('sv'));
stage.canvasOutline = true;   /* the goo's outline is drawn on the map canvas (drawOutlines), not as an SVG mask per strand */
/* the microscope look: ?lens=vignette,bokeh,... picks effects (lens.js); ?lens=off for none */
let lowOn = false;   /* low detail (see setLowDetail) */
const LENS = window.SoupLens.create({pond:$('pond'), under:$('top'), MAP, low:() => lowOn});
{ const q = new URLSearchParams(location.search).get('lens'); if (q != null) LENS.set(q === 'off' ? [] : q.split(',')); }
let me = null, fx = [], paused = false, clockT = 0;
let uiDirty = true, pointer = null, showThoughts = true;
const T = {};
const sim = window.SoupSim.create({MAP, BOTS, stage, minStrands:10, hooks:{
  say:(p, text) => { if (p === me) say(text); },
  fx:e => fx.push(Object.assign({t:0}, e)),
  dirty:p => { if (p === me) uiDirty = true; },
  end:rows => showEnd(rows),
  tint:col => col === 'stain' ? null : {spine:T[col], goo:T[col]}}});
/* multiplayer: a page at rna.game/<room> joins that room on the server; the home page is single-player against bots */
const ROOM = (n => n && !['ws', 'r', 'api', 'privacy', 'about', 'index', 'favicon', 'robots', 'version', 'lab', 'names'].includes(n) ? n : null)(
  ((location.pathname.match(/^\/(?:r\/)?([a-z0-9][a-z0-9-]{0,31})\/?$/i) || [])[1] || '').toLowerCase());
/* after a deploy, offer a refresh. The page asks /version which deploy it was loaded from, then checks again
   every few minutes and whenever the tab comes back into view; in a room the server also says on (re)joining. */
let VERSION = null;
function offerRefresh(){
  if ($('newver')) return;
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'newver'; b.className = 'newver'; b.textContent = 'New version ready. Refresh';
  b.addEventListener('click', () => location.reload());
  $('toast').before(b);
}
async function checkVersion(){
  if (!/^https?:$/.test(location.protocol) || document.hidden) return;
  try {
    const r = await fetch('/version', {cache:'no-store'}); if (!r.ok) return;
    const {v} = await r.json(); if (!v || v === 'dev') return;
    if (!VERSION) VERSION = v; else if (v !== VERSION) offerRefresh();
  } catch(e){}
}
checkVersion(); setInterval(checkVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', checkVersion);
const net = ROOM && window.SoupNet ? window.SoupNet.create({RS, MAP, stage, version:() => VERSION, hooks:{
  outdated:() => offerRefresh(),
  say:text => say(text),
  dirty:() => { uiDirty = true; },
  fx:e => fx.push(Object.assign({t:0}, e)),
  end:rows => showEnd(rows),
  welcome:() => { me = net.me; uiDirty = true; camT = null; $('overlay').hidden = true; if (watchOnly) $('watchBar').hidden = false; },
  status:text => { const el = $('netStatus'); if (el) el.textContent = text; else if (text) say(text); },
  host:() => renderLobby(),
  tint:(col, bot) => col === 'stain' ? null : {spine:T[col], goo:T[col]}}}) : null;
/* the page draws whichever world it has: the local sim, or the mirror of a server room */
const world = net || sim;
const working = p => world.working(p), has = (p, fn) => world.has(p, fn), complexity = p => world.complexity(p);
const L = {get players(){ return world.players; }, get nucs(){ return world.nucs; }, get frags(){ return world.frags; }};

/* ---------- spectating: the camera follows another strand; your own waits where it is ---------- */
let watchId = null, tour = false, tourT = 0, watchOnly = false;
/* whose view the screen shows: the strand being watched, or yours */
const focusP = () => (watchId != null && L.players.find(p => p.id === watchId)) || me;
const others = () => L.players.filter(p => p !== me && (!net || net.inRoster(p.id))).sort((a, b) => a.id - b.id);
function watch(p){
  watchId = p ? p.id : null; tourT = 0;
  if (net) net.spectate(watchId);
  camT = null;   /* jump straight there */
  $('watchBar').hidden = watchId == null;
  $('bWatch').setAttribute('aria-pressed', watchId != null);
  if (watchId != null && panelOpen) openPanel(false);
  uiDirty = true; renderWatch();
}
function cycle(d){
  const list = others(); if (!list.length) return;
  const i = list.findIndex(p => p.id === watchId);
  watch(list[i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length]);
}
function stopWatching(){ if (watchOnly) return; tour = false; $('wTour').setAttribute('aria-pressed', 'false'); watch(null); }
function setTour(on){ tour = on; tourT = 0; $('wTour').setAttribute('aria-pressed', on); }
function renderWatch(){
  const p = watchId != null ? focusP() : null; if (!p || p === me) return;
  const rows = world.standings(), rank = rows.findIndex(r => r.p === p) + 1;
  $('wName').textContent = `${p.name} · ${complexity(p)}${rank ? ' · ' + ORD(rank) : ''}`;
  const style = p.isBot && p.mind ? BOTS.describe(p) : '';
  $('wNote').textContent = !p.alive ? 'waiting to re-form' : [p.ai && p.ai.label, style].filter(Boolean).join(' · ') || (p.isBot ? 'bot' : 'player');
}

function reset(){
  if (net){ showStart(); return; }
  if (!me) me = sim.addHuman('You', 'stain');
  sim.reset(null, WANT_WORLD ? {world:terrainOpt()} : undefined);
  fx = []; camT = null; paused = false; pointer = null;
  $('bPause').setAttribute('aria-pressed', 'false');
  uiDirty = true;
  showStart();
}
function step(dt){
  if (net){
    let aim = null;
    if (me && watchId == null) aim = aimAt();
    net.update(dt, aim);
    if (net.me && me !== net.me){ me = net.me; uiDirty = true; }
  } else {
    if (sim.state === 'play'){ aimPlayer(); if (lesson && !paused) lessonTick(dt); }
    const t0 = performance.now();
    for (let k = 0; k < devFast; k++) sim.step(dt);
    stepMs += (performance.now() - t0 - stepMs) * 0.05;
  }
  for (let i = fx.length - 1; i >= 0; i--){ fx[i].t += dt; if (fx[i].t > fx[i].dur) fx.splice(i, 1); }
}
const doFold = p => world.fold(p), doDrop = p => world.drop(p);

/* ---------- health reports: anonymous notes when something goes wrong on a player's machine ----------
   A JavaScript error (at most 5 per page load), or a frame rate averaging under 20 over a minute of play (once).
   Sent: the error and where, frame rate and timings, screen size, whether it is a Chromebook, low detail, single-player
   or room, and the version. Never names, codons, room names or anything else about the player. */
const HEALTH = /^https?:$/.test(location.protocol);
let errorsSent = 0, slowSent = false, playSecs = 0, frameN = 0, frameT = 0, worstFps = 999;
const sentErrors = new Set();
const sysInfo = () => ({v:VERSION || 'dev', mode:net ? (watchOnly ? 'watch' : 'room') : 'solo', screen:`${innerWidth}x${innerHeight}`, dpr:window.devicePixelRatio || 1,
  cros:/CrOS/.test(navigator.userAgent), low:lowOn, px:Math.round(cw * dpr) * Math.round(ch * dpr), secs:Math.round(playSecs)});
function sendReport(r){
  if (!HEALTH) return;
  const body = JSON.stringify(Object.assign(sysInfo(), r));
  try { if (navigator.sendBeacon && navigator.sendBeacon('/report', new Blob([body], {type:'application/json'}))) return; } catch(e){}
  try { fetch('/report', {method:'POST', body, keepalive:true}); } catch(e){}
}
function reportError(msg, where){
  const key = msg + '|' + where; if (errorsSent >= 5 || sentErrors.has(key)) return;
  sentErrors.add(key); errorsSent++; sendReport({kind:'error', msg:String(msg).slice(0, 300), where:String(where || '').replace(/^.*\//, '').slice(0, 120)});
}
window.addEventListener('error', e => reportError(e.message || 'error', e.filename ? `${e.filename}:${e.lineno}:${e.colno}` : ''));
window.addEventListener('unhandledrejection', e => reportError('Unhandled: ' + ((e.reason && e.reason.message) || e.reason), (e.reason && e.reason.stack || '').split('\n')[1] || ''));
/* frame rate while actually playing (round on, tab visible, not paused), checked once a minute of play */
function trackHealth(dt){
  if (!HEALTH || slowSent || document.hidden || paused || world.state !== 'play') return;
  playSecs += dt; frameN++; frameT += dt;
  if (frameT >= 10) worstFps = Math.min(worstFps, frameN / frameT);
  if (frameT >= 10){ healthFrames += frameN; healthSecs += frameT; frameN = 0; frameT = 0;
    if (healthSecs >= 60){ const avg = healthFrames / healthSecs; if (avg < 20){ slowSent = true; sendReport({kind:'slow', fps:avg, fpsLow:worstFps, stepMs, drawMs, strands:L.players.length}); } healthFrames = 0; healthSecs = 0; } }
}
let healthFrames = 0, healthSecs = 0;

/* ---------- ?dev: frame and step times, what is under the pointer, a ground-type map, and (single-player) test buttons ---------- */
const DEV = new URLSearchParams(location.search).has('dev');
let devBiomes = false, devFast = 1, stepMs = 0, drawMs = 0, devOpen = {};
try { devOpen = JSON.parse(localStorage.getItem('soup2.devOpen') || '{}') || {}; } catch(e){}
const BIO = window.SoupBiomes;
const devCol = i => `hsl(${(i * 137.5) % 360} 75% 55%)`;
function devSetup(){
  if (!DEV) return;
  const solo = !net, seg = SEG.LIST.map(s => `<button class="btn" type="button" data-add="${s.fn}">+${s.fn}</button>`).join('');
  /* sections fold away; which ones are open is remembered */
  const sec = (id, title, body, open) => `<details class="sec" data-sec="${id}"${(devOpen[id] ?? open) ? ' open' : ''}><summary>${title}</summary><div class="body">${body}</div></details>`;
  const lucky = SEG.LIST.map(s => { const out = []; for (let i = 0; i < s.core.length; i++) for (const b of 'AUGC') if (b !== s.core[i] && RS.mutationEffect(s.fn, i, b) > 1) out.push(`${s.core[i]}${i + 3}${b}`); return `${s.fn}: ${out.join(' ') || 'none'}`; }).join('\n');
  $('dev').innerHTML = `<pre id="devStats"></pre>`
    + `<div class="row"><button class="btn" type="button" id="allCopy">Copy all settings</button><button class="btn" type="button" id="allPaste">Paste settings</button></div>`
    + sec('look', 'Map look', lookPanel(), true)
    + sec('segs', 'Segments', tunePanel(), false)
    + sec('terrain', 'Terrain', terrainPanel(), false)
    + sec('lens', 'Microscope effects', `<div class="row">${LENS.ALL.map(k => `<button class="btn" type="button" data-lens="${k}" aria-pressed="${LENS.has(k)}">${k}</button>`).join('')}</div>`, false)
    + (solo ? sec('test', 'Test tools', `<h3>Add to your strand</h3><div class="row">${seg}</div>`
      + `<h3>Make it happen here</h3><div class="row"><button class="btn" type="button" data-do="frag">Fragment</button><button class="btn" type="button" data-do="meteor">Meteorite</button>`
      + `<button class="btn" type="button" data-do="uv">UV flash</button><button class="btn" type="button" data-do="damage">Damage me</button></div>`
      + `<h3>Round</h3><div class="row"><button class="btn" type="button" id="dFast" aria-pressed="false">Speed ×4</button><button class="btn" type="button" data-do="minute">−1 min</button>`
      + `<button class="btn" type="button" data-do="end">End round</button><button class="btn" type="button" id="dBots" aria-pressed="false">No bots</button></div>`, false) : '')
    + sec('ref', 'Reference', `<div class="row"><button class="btn" type="button" id="dBio" aria-pressed="false">Ground map <kbd>B</kbd></button></div>`
      + `<div class="legend" id="devLegend" hidden>${BIO.CELLS.map((c, i) => `<span style="--c:${devCol(i)}">${c.key.toLowerCase()}</span>`).join('')}</div>`
      + `<h3>Lucky mistakes (answer key)</h3><pre>${lucky}</pre>`, false);
  $('dev').addEventListener('toggle', e => { const d = e.target.closest('[data-sec]'); if (!d) return; devOpen[d.dataset.sec] = d.open; try { localStorage.setItem('soup2.devOpen', JSON.stringify(devOpen)); } catch(err){} }, true);
  wireLookPanel(); wireTunePanel(); wireTerrainPanel(); wireAllSettings();
  $('dev').hidden = false;
  $('dBio').addEventListener('click', toggleBiomes);
  $('dev').addEventListener('click', e => {
    const b = e.target.closest('[data-lens]'); if (!b) return;
    LENS.toggle(b.dataset.lens);
    for (const x of $('dev').querySelectorAll('[data-lens]')) x.setAttribute('aria-pressed', LENS.has(x.dataset.lens));
  });
  if (!solo) return;
  /* "here" is where the pointer is, or your head */
  const here = () => pointer ? {x:clamp(camX + pointer.x / scale, 5, W - 5), y:clamp(camY + pointer.y / scale, 5, H - 5)} : {x:me.s.head.x, y:me.s.head.y};
  $('dev').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !me) return;
    if (b.dataset.add){ const add = RS.recipeSeq(b.dataset.add); me.s.appendFolded(add, [{fn:b.dataset.add, start:0, end:add.length - 1}]); uiDirty = true; }
    const h = me.s.head;
    switch (b.dataset.do){
      case 'frag': sim.spawnFrag({x:h.x + 140, y:h.y}); break;
      case 'meteor': { const at = here(); MAP.meteors.push({x:at.x, y:at.y, t:4.5, r:240}); break; }
      case 'uv': { const at = here(); MAP.uvFlashes.push({x:at.x, y:at.y, r:170, t:3.5}); break; }
      case 'damage': me.s.damage(); uiDirty = true; break;
      case 'minute': sim.timeLeft = Math.max(1, sim.timeLeft - 60); break;
      case 'end': sim.timeLeft = 0.05; break;
    }
  });
  $('dFast').addEventListener('click', () => { devFast = devFast === 1 ? 4 : 1; $('dFast').setAttribute('aria-pressed', devFast > 1); });
  $('dBots').addEventListener('click', () => { const none = $('dBots').getAttribute('aria-pressed') !== 'true'; sim.setMinStrands(none ? 1 : 10); $('dBots').setAttribute('aria-pressed', none); });
}
function toggleBiomes(){ devBiomes = !devBiomes; $('dBio').setAttribute('aria-pressed', devBiomes); $('devLegend').hidden = !devBiomes; }
/* every cell in view tinted by its ground type */
function drawBiomes(g, vw, vh){
  const C = MAP.CELL, x0 = Math.max(0, Math.floor(camX / C)), x1 = Math.min(W / C - 1, Math.floor((camX + vw) / C));
  const y0 = Math.max(0, Math.floor(camY / C)), y1 = Math.min(H / C - 1, Math.floor((camY + vh) / C));

function terrainPanel(){

  const row = (attr, k, label, a, b, st, v, def) => `<label class="lk tk${v !== def ? ' changed' : ''}" title="Shipped value: ${fmtStep(def, st)}"><span>${label}</span><input type="range" ${attr}="${k}" min="${a}" max="${b}" step="${st}" value="${v}"><output>${fmtStep(v, st)}</output><button type="button" data-${attr.slice(5)}-reset="${k}" aria-label="Back to the shipped value">↺</button></label>`;
  const p = terrain.place;
  return `<p class="fine">Changes take effect when you rebuild the map (same seed; the round restarts).${terrainMs != null ? ` Last build: ${(terrainMs / 1000).toFixed(1)} s.` : ''}</p>`
    + `<div class="row"><button class="btn" type="button" id="trBuild">Rebuild map</button><button class="btn" type="button" id="trNew">New seed</button><button class="btn" type="button" id="trReset">Reset terrain</button></div>`
    + TERRAIN_GROUPS.map(([h, list]) => `<div class="tuneHead">${h}</div>` + list.map(([k, t, a, b, st]) => row('data-terr', k, t, a, b, st, terrVal(k), WGN.DEFAULTS[k])).join('')).join('')
    + `<div class="tuneHead">Diffusion texture</div><div class="row"><button class="btn" type="button" id="trTex" aria-pressed="${!!terrain.texture}">Texture ${terrain.texture ? 'on' : 'off'}</button><span class="note">adds build time on every device</span></div>`
    + TEX_SLIDERS.map(([k, t, a, b, st]) => row('data-terr', k, t, a, b, st, terrVal(k), WGN.DEFAULTS[k])).join('')
    + row('data-titer', 'iters', 'Growth steps', 300, 6000, 100, terrain.iters, 3000)
    + `<div class="tuneHead">Texture in one place</div><div class="row">${TEX_PLACES.map(id => `<button class="btn" type="button" data-tplace="${id}" aria-pressed="${id === p}">${PLACE_LABEL[id]}${terrain.places[id] ? ' •' : ''}</button>`).join('')}</div>`
    + TEX_LOCAL.map(([k, t, a, b, st]) => row('data-tloc', k, t, a, b, st, WGN.TEXTURES[p][k], TEX_DEF[p][k])).join('');
}
function syncTerrainPanel(){ const d = $('dev').querySelector('[data-sec="terrain"] .body'); if (d) d.innerHTML = terrainPanel(); }
function rebuildMap(newSeed){
  if (net || !WANT_WORLD) return;
  const playing = sim.state === 'play', t0 = performance.now();
  sim.reset(newSeed ? null : sim.seed, {world:terrainOpt()}); terrainMs = performance.now() - t0;
  fx = []; camT = null; uiDirty = true; MAP.setWorldLook(looks[looks.slot]);
  if (playing){ sim.start(); $('overlay').hidden = true; } else showStart();
  syncTerrainPanel();
}
function wireTerrainPanel(){
  const d = $('dev');
  d.addEventListener('input', e => {
    const t = e.target, out = t.nextElementSibling;
    if (t.dataset.terr){ const k = t.dataset.terr; if (+t.value === WGN.DEFAULTS[k]) delete terrain.settings[k]; else terrain.settings[k] = +t.value; }
    else if (t.dataset.titer){ terrain.iters = +t.value; }
    else if (t.dataset.tloc){ const p = terrain.place, k = t.dataset.tloc; WGN.TEXTURES[p][k] = +t.value; terrain.places[p] = Object.assign({}, terrain.places[p], {[k]:+t.value}); if (WGN.TEXTURES[p][k] === TEX_DEF[p][k]){ delete terrain.places[p][k]; if (!Object.keys(terrain.places[p]).length) delete terrain.places[p]; } }
    else return;
    if (out) out.textContent = fmtStep(t.value, +t.step); t.closest('.tk').classList.add('changed'); saveTerrain();
  });
  d.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'trBuild') rebuildMap(false);
    else if (b.id === 'trNew') rebuildMap(true);
    else if (b.id === 'trTex'){ terrain.texture = !terrain.texture; saveTerrain(); syncTerrainPanel(); }
    else if (b.id === 'trReset'){ terrain = {settings:{}, texture:false, iters:3000, places:{}, place:terrain.place}; for (const id in TEX_DEF) Object.assign(WGN.TEXTURES[id], TEX_DEF[id]); saveTerrain(); syncTerrainPanel(); }
    else if (b.dataset.tplace){ terrain.place = b.dataset.tplace; saveTerrain(); syncTerrainPanel(); }
    else if (b.dataset.terrReset){ delete terrain.settings[b.dataset.terrReset]; saveTerrain(); syncTerrainPanel(); }
    else if (b.dataset.titerReset){ terrain.iters = 3000; saveTerrain(); syncTerrainPanel(); }
    else if (b.dataset.tlocReset){ const p = terrain.place, k = b.dataset.tlocReset; WGN.TEXTURES[p][k] = TEX_DEF[p][k]; if (terrain.places[p]){ delete terrain.places[p][k]; if (!Object.keys(terrain.places[p]).length) delete terrain.places[p]; } saveTerrain(); syncTerrainPanel(); }
  });
}
/* ---------- dev panel: every setting at once (looks, segments, terrain), to copy out or paste back in ---------- */
function allSettings(){ return {looks:{filled:looks.filled, lines:looks.lines}, segments:SEG.tuneChanged(), terrain:{settings:terrain.settings, texture:terrain.texture, iters:terrain.iters, places:terrain.places}}; }
function applyAllSettings(o){
  if (o.looks){ for (const k of ['filled', 'lines']) if (o.looks[k]) looks[k] = Object.assign(freshLooks()[k], o.looks[k]); applyLook(); syncLookPanel(); }
  else if (o.lines || o.filled){ for (const k of ['filled', 'lines']) if (o[k]) looks[k] = Object.assign(freshLooks()[k], o[k]); applyLook(); syncLookPanel(); }
  if (o.segments){ SEG.tuneReset(); SEG.tuneApply(o.segments); saveTune(); syncTunePanel(); }
  if (o.terrain){ for (const id in TEX_DEF) Object.assign(WGN.TEXTURES[id], TEX_DEF[id]); terrain = Object.assign({settings:{}, texture:false, iters:3000, places:{}, place:terrain.place}, o.terrain);
    for (const id in terrain.places) if (WGN.TEXTURES[id]) Object.assign(WGN.TEXTURES[id], terrain.places[id]); saveTerrain(); syncTerrainPanel(); }
}
function wireAllSettings(){
  $('allCopy').addEventListener('click', () => { const txt = JSON.stringify(allSettings()); navigator.clipboard && navigator.clipboard.writeText(txt).then(() => say('All settings copied.'), () => say(txt)); });
  $('allPaste').addEventListener('click', async () => {
    let txt = null; try { txt = navigator.clipboard && await navigator.clipboard.readText(); } catch(e){}
    if (!txt) txt = prompt('Paste settings (JSON):');
    if (!txt) return;
    try { applyAllSettings(JSON.parse(txt)); say('Settings applied.' + (txt.includes('"terrain"') && !net ? ' Rebuild the map to see terrain changes.' : '')); } catch(e){ say('Those settings could not be read.'); }
  });
}
function wireLookPanel(){
  const d = $('dev');
  d.addEventListener('input', e => {
    const L = looks[looks.slot], t = e.target;
    if (t.dataset.look){ L[t.dataset.look] = +t.value; d.querySelector(`[data-out="${t.dataset.look}"]`).textContent = (+t.value).toFixed(+t.step < 0.01 ? 3 : 2); applyLook(); if (t.dataset.look === 'hueShift') syncLows(); }
    else if (t.dataset.col){ if (t.dataset.col === 'deep') L.deep = unhex(t.value); else L.colours = Object.assign({}, L.colours, {[t.dataset.col]:unhex(t.value)}); applyLook(); if (!(L.coloursLow || {})[t.dataset.col]) syncLookPanel(); }
    else if (t.dataset.col2){ L.coloursLow = Object.assign({}, L.coloursLow, {[t.dataset.col2]:unhex(t.value)}); applyLook(); }
  });
  d.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.slot){ looks.slot = b.dataset.slot; applyLook(); syncLookPanel(); }
    else if (b.dataset.preset){ Object.assign(looks[looks.slot], LOOK_PRESETS[b.dataset.preset]); applyLook(); syncLookPanel(); }
    else if (b.id === 'lkLowClear'){ looks[looks.slot].coloursLow = {}; applyLook(); syncLookPanel(); }
    else if (b.id === 'lkReset'){ looks[looks.slot] = freshLooks()[looks.slot]; applyLook(); syncLookPanel(); }
    else if (b.id === 'lkCopy'){ const txt = JSON.stringify({[looks.slot]:looks[looks.slot]}); navigator.clipboard && navigator.clipboard.writeText(txt).then(() => say('Look settings copied.'), () => say(txt)); }
  });
  syncLookPanel();
}
$('bRec').addEventListener('click', () => openPanel(true));
$('bStart').addEventListener('click', () => { if (net && net.isHost) net.start(); });
$('autoBox').addEventListener('change', e => { if (net && net.isHost) net.setAuto(e.target.checked); });
$('mapBox').addEventListener('change', e => { if (net && net.isHost) net.setMap(e.target.checked ? 'classic' : 'world'); });
$('bWatch').addEventListener('click', () => { if (watchId == null) cycle(1); else stopWatching(); });
$('wPrev').addEventListener('click', () => { setTour(false); cycle(-1); });
$('wNext').addEventListener('click', () => { setTour(false); cycle(1); });
$('wTour').addEventListener('click', () => setTour(!tour));
$('wStop').addEventListener('click', stopWatching);
$('trk').addEventListener('click', () => openPanel(true));
$('bClose').addEventListener('click', () => openPanel(false));
$('bFold').addEventListener('click', () => { if (world.state === 'play' && me && !doFold(me)) say('Nothing to fold yet.'); });
$('bDrop').addEventListener('click', () => { if (world.state === 'play' && me) doDrop(me); });
document.addEventListener('keyup', e => { const k = keyOf(e); if (k) keysDown.delete(k); });
window.addEventListener('blur', () => keysDown.clear());
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target instanceof HTMLInputElement) return;   /* typing a room name */
  const sk = keyOf(e), watchingNow = watchId != null || watchOnly;
  if (sk && !(watchingNow && sk.startsWith('Arrow'))){
    e.preventDefault();
    if (watchingNow) return;
    keysDown.add(sk); keyMode = true; touchMode = false; return;
  }
  const onButton = e.target instanceof HTMLButtonElement;
  if (e.key === ' ' || e.key === 'f' || e.key === 'F'){
    if (e.key === ' ' && onButton && e.target.id !== 'bFold') return;
    e.preventDefault();
    if (!net && sim.state === 'ready'){ begin(); return; }
    if (watchId != null){ say('You are watching. Press V to go back to your strand.'); return; }
    if (world.state === 'play' && me && !paused && !doFold(me)) say('Nothing to fold yet.');
  } else if (e.key === 'x' || e.key === 'X' || e.key === 'Backspace'){ e.preventDefault(); if (world.state === 'play' && me && !paused) doDrop(me); }
  else if (e.key === 'p' || e.key === 'P') togglePause();
  else if (e.key === 'o' || e.key === 'O') toggleLook();
  else if (e.key === 'r' || e.key === 'R') openPanel();
  else if (e.key === 'Escape' && panelOpen) openPanel(false);
  else if ((e.key === 'v' || e.key === 'V') && !lesson){ if (watchId == null) cycle(1); else stopWatching(); }
  else if ((e.key === 'ArrowRight' || e.key === ']') && (watchId != null || watchOnly)){ e.preventDefault(); setTour(false); cycle(1); }
  else if ((e.key === 'ArrowLeft' || e.key === '[') && (watchId != null || watchOnly)){ e.preventDefault(); setTour(false); cycle(-1); }
  else if (e.key === 'Escape' && watchId != null) stopWatching();
  else if (DEV && (e.key === 'b' || e.key === 'B')) toggleBiomes();
  else if (e.key === 't' || e.key === 'T') { showThoughts = !showThoughts; say(showThoughts ? 'Showing what the bots are thinking.' : 'Bot thoughts hidden.'); }
});

/* ---------- boot ---------- */
function start(){
  /* the lab's look, a little larger so strands read at game scale */
  RS.S.glyphSize = 4; RS.S.gooSize = 30; RS.restyle();
  readTokens(); buildList(); devSetup();
  try { if (localStorage.getItem('soup2.low') === '1') setLowDetail(true); } catch(e){}
  applyLook();
  if (net) $('bPause').hidden = true;   /* a shared room cannot pause */
  reset(); resize();
  if (LEARN_ROOM != null && !net) startLesson();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  let last = performance.now(), fpsT = 0, fpsN = 0, acc = 0;
  (function frame(now){
    const raw = (now - last) / 1000, dt = Math.min(0.1, raw); last = now; W = MAP.W; H = MAP.H;
    if ($('bLook').hidden === !!MAP.world){ $('bLook').hidden = !MAP.world; syncLookPanel(); }   /* only the generated world has these looks */
    fpsT += raw; fpsN++; if (fpsT >= 1)   /* real time, so a frame rate under 10 is reported as it is */{ window.__fps = fpsN / fpsT; fpsT = 0; fpsN = 0; watchSpeed(); }
    /* steps of 1/60 s, as in the specimen, so swimming feels the same at any frame rate. When frames are slow, steps of
       up to 1/30 s (the server's rate) and at most three a frame, so a slow device does not spend each frame catching
       up with four small steps (which made it slower still) */
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 3){ const h = Math.min(1 / 30, acc); if (!paused) step(h); acc -= h; n++; }
    if (n === 3) acc = 0;
    /* while the start screen shows, draw the ground around your strand ahead of time, so the round starts without gaps */
    if (me && !$('overlay').hidden && MAP.world) MAP.warm(me.s.head.x, me.s.head.y, 12, 2);
    /* a watcher has no strand: follow someone as soon as the room's strands arrive */
    if (watchOnly && watchId == null && others().length) watch(others()[0]);
    /* the tour moves on every 15 seconds */
    if (tour && watchId != null){ tourT += dt; if (tourT > 15) cycle(1); }
    if (me || (watchOnly && watchId != null && focusP())){
      if (uiDirty){ uiDirty = false; renderUI(); }
      clockT += dt; if (clockT > 0.25){ clockT = 0; renderClock(); renderDev(); }
      const d0 = performance.now();
      draw(now / 1000);
      drawMs += (performance.now() - d0 - drawMs) * 0.05;
      trackHealth(Math.min(1, raw));
    }
    requestAnimationFrame(frame);
  })(last);
  window.__game = {step, begin, doFold, doDrop, reset, sim, net, world, strike:sim.strike, uvFlash:sim.uvFlash, impact:sim.impact, geyserBurst:sim.geyserBurst,
    complexity, spawnFrag:sim.spawnFrag, track, get mapEv(){ return sim.mapEv; },
    get cam(){ return {x:camX, y:camY, scale}; }, get lesson(){ return lesson && {i:lesson.i, target:lesson.target}; },
    get me(){ return me; }, get players(){ return sim.players; }, get frags(){ return sim.frags; }, get nucs(){ return sim.nucs; },
    get timeLeft(){ return sim.timeLeft; }, get over(){ return sim.state === 'over'; }, get fps(){ return window.__fps; }, RS, stage};
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start();
})();
